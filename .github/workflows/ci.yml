name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 0.31.0
          avm use 0.31.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate local keypair
        run: solana-keygen new --no-bip39-passphrase --force

      - name: Pin dependencies for Solana bundled Rust
        run: |
          cargo update blake3 --precise 1.5.5 || true
          cargo update bytemuck_derive --precise 1.8.1 || true
          cargo update indexmap --precise 2.11.0 || true
          cargo update toml_parser --precise 1.0.1 || true
          cargo update toml_edit --precise 0.22.20 || true
          cargo update toml_datetime --precise 0.6.8 || true

      - name: Build
        run: anchor build

      - name: Test
        run: anchor test
